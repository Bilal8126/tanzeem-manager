<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Deep green → blue diagonal base (matches the app's green+blue brand blend) -->
    <linearGradient id="bgG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#022c22"/>
      <stop offset="45%"  stop-color="#047857"/>
      <stop offset="78%"  stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <!-- Gold gradient for crescent, star, trim & text -->
    <linearGradient id="goldG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#fef3c7"/>
      <stop offset="50%"  stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <!-- Cool white-blue glass gradient for the mosque silhouette -->
    <linearGradient id="wG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="45%"  stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <!-- Crescent cutout mask -->
    <mask id="cMask">
      <circle cx="0" cy="0" r="27" fill="white"/>
      <circle cx="12" cy="-8" r="21" fill="black"/>
    </mask>
    <clipPath id="roundedClip">
      <rect width="512" height="512" rx="118"/>
    </clipPath>
    <!-- Vignette for depth -->
    <radialGradient id="vig" cx="50%" cy="38%" r="72%">
      <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.32"/>
    </radialGradient>
  </defs>

  <!-- ── Background ─────────────────────────────────── -->
  <rect width="512" height="512" rx="118" fill="url(#bgG)"/>

  <!-- Dynamic glow accents + faint corner motif (clipped to rounded square) -->
  <g clip-path="url(#roundedClip)">
    <circle cx="66" cy="64" r="150" fill="#34d399" opacity="0.22"/>
    <circle cx="458" cy="458" r="196" fill="#2563eb" opacity="0.40"/>
    <path d="M-40,170 L212,-40 L332,-40 L-40,290 Z" fill="#ffffff" opacity="0.06"/>

    <!-- subtle corner emblem ornaments -->
    <g opacity="0.30" fill="url(#goldG)">
      <g transform="translate(58,58) scale(0.75)">
        <polygon points="0,-16 3.8,-6.3 12.5,-12.5 6.3,-3.8 16,0 6.3,3.8 12.5,12.5 3.8,6.3 0,16 -3.8,6.3 -12.5,12.5 -6.3,3.8 -16,0 -6.3,-3.8 -12.5,-12.5 -3.8,-6.3"/>
      </g>
      <g transform="translate(454,58) scale(0.75)">
        <polygon points="0,-16 3.8,-6.3 12.5,-12.5 6.3,-3.8 16,0 6.3,3.8 12.5,12.5 3.8,6.3 0,16 -3.8,6.3 -12.5,12.5 -6.3,3.8 -16,0 -6.3,-3.8 -12.5,-12.5 -3.8,-6.3"/>
      </g>
    </g>
  </g>

  <!-- Outer ornamental ring -->
  <rect x="14" y="14" width="484" height="484" rx="106" fill="none" stroke="url(#goldG)" stroke-width="1.6" opacity="0.45"/>
  <rect x="6" y="6" width="500" height="500" rx="112" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="2"/>

  <!-- ── Crescent Moon + Star ───────────────────────── -->
  <g transform="translate(256,98)">
    <circle r="34" fill="none" stroke="#fbbf24" stroke-width="1" opacity="0.28"/>
    <circle r="26" fill="url(#goldG)" mask="url(#cMask)"/>
    <g transform="translate(38,-13)">
      <polygon points="0,-14 3.4,-4.7 13.3,-4.3 5.4,1.7 8.2,11.8 0,5.8 -8.2,11.8 -5.4,1.7 -13.3,-4.3 -3.4,-4.7" fill="url(#goldG)"/>
    </g>
    <g transform="translate(-44,9)" opacity="0.85">
      <path d="M0,-7 L1.8,0 L0,7 L-1.8,0 Z" fill="#fef3c7"/>
      <path d="M-7,0 L0,1.8 L7,0 L0,-1.8 Z" fill="#fef3c7"/>
    </g>
  </g>

  <!-- ── Mosque ─────────────────────────────────────── -->

  <!-- Left minaret -->
  <g>
    <rect x="112" y="234" width="28" height="136" fill="url(#wG)" rx="4"/>
    <path d="M112,236 L126,192 L140,236 Z" fill="url(#wG)"/>
    <rect x="112" y="250" width="28" height="4" fill="url(#goldG)" opacity="0.7"/>
    <circle cx="126" cy="186" r="6.5" fill="url(#goldG)"/>
    <circle cx="126" cy="175" r="4"   fill="url(#goldG)" opacity="0.75"/>
  </g>

  <!-- Right minaret -->
  <g>
    <rect x="372" y="234" width="28" height="136" fill="url(#wG)" rx="4"/>
    <path d="M372,236 L386,192 L400,236 Z" fill="url(#wG)"/>
    <rect x="372" y="250" width="28" height="4" fill="url(#goldG)" opacity="0.7"/>
    <circle cx="386" cy="186" r="6.5" fill="url(#goldG)"/>
    <circle cx="386" cy="175" r="4"   fill="url(#goldG)" opacity="0.75"/>
  </g>

  <!-- Onion dome + body -->
  <path d="M164,264 C164,206 208,140 256,130 C304,140 348,206 348,264 Z" fill="url(#wG)"/>
  <path d="M204,238 Q256,160 308,238" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="6" stroke-linecap="round"/>
  <path d="M222,246 Q256,192 290,246" fill="none" stroke="rgba(37,99,235,0.16)" stroke-width="10" stroke-linecap="round"/>
  <line x1="256" y1="130" x2="256" y2="104" stroke="url(#goldG)" stroke-width="5" stroke-linecap="round"/>
  <circle cx="256" cy="96" r="8" fill="url(#goldG)"/>

  <rect x="168" y="264" width="176" height="106" fill="url(#wG)"/>
  <rect x="168" y="264" width="176" height="10" fill="url(#goldG)" opacity="0.6"/>

  <!-- Doorway arch -->
  <path d="M232,370 L232,316 Q232,290 256,290 Q280,290 280,316 L280,370 Z" fill="#022c22" opacity="0.62"/>
  <!-- Side arch windows -->
  <path d="M188,368 L188,334 a12,12 0 0 1 24,0 L212,368 Z" fill="#022c22" opacity="0.32"/>
  <path d="M300,368 L300,334 a12,12 0 0 1 24,0 L324,368 Z" fill="#022c22" opacity="0.32"/>

  <!-- Base platform -->
  <rect x="100" y="370" width="312" height="12" fill="url(#wG)" rx="6"/>
  <rect x="88"  y="382" width="336" height="7"  fill="url(#goldG)" rx="3.5" opacity="0.9"/>

  <!-- Ground reflection glow -->
  <ellipse cx="256" cy="394" rx="150" ry="9" fill="#2563eb" opacity="0.18"/>

  <!-- ── Ornamental divider ──────────────────────────── -->
  <g transform="translate(0,412)">
    <line x1="70" y1="0" x2="442" y2="0" stroke="url(#goldG)" stroke-width="1.2" opacity="0.6"/>
    <polygon points="256,-6 262,0 256,6 250,0" fill="url(#goldG)"/>
    <circle cx="222" cy="0" r="2" fill="url(#goldG)" opacity="0.7"/>
    <circle cx="290" cy="0" r="2" fill="url(#goldG)" opacity="0.7"/>
  </g>

  <!-- ── Urdu name ───────────────────────────────────── -->
  <text x="256" y="446"
        font-family="'Noto Naskh Arabic','Scheherazade New','Amiri','Traditional Arabic',serif"
        font-size="33" font-weight="700" fill="url(#goldG)"
        text-anchor="middle" dominant-baseline="middle"
        direction="rtl" unicode-bidi="embed">تنظیم عبد مصطفیٰ</text>

  <!-- ── English name ────────────────────────────────── -->
  <text x="256" y="478"
        font-family="-apple-system,'Segoe UI',Roboto,sans-serif"
        font-size="13" font-weight="700" fill="rgba(255,255,255,0.62)"
        text-anchor="middle" dominant-baseline="middle"
        letter-spacing="2">TANZEEM ABD-E-MUSTAFA</text>

  <!-- Vignette overlay (must stay last for depth) -->
  <rect width="512" height="512" rx="118" fill="url(#vig)"/>
</svg>
